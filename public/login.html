<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05050a">
  <link rel="icon" type="image/png" href="fastlectures-mark.png">
  <title>Sign in | FastLectures</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <div class="auth-layout">
    <header class="auth-header">
      <a class="auth-brand" href="/" aria-label="Back to canvas">
        <svg class="auth-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6c-.8-.9-2-1.5-3.4-1.6H6.6C5 3 3.5 3.6 2.4 4.8 1.3 6 1 7.5 1.6 9l2.3 12.8c.2 1.2 1.2 2.1 2.5 2.2h9.2c1.3.1 2.3-1 2.5-2.2L22.4 9c.6-1.5.3-3-.8-4.4zM8 17l-1.5-8.8h2L10 17H8zm4 0h2.1l.6-3.6.8-4.5H13L12.2 17zm6.5 0h-2.2l-1.4-8H19l1.5 8z"/></svg>
        <span class="auth-name">FastLectures</span>
      </a>
    </header>

    <main class="auth-card" role="form" aria-labelledby="login-heading">
      <h1 id="login-heading" class="auth-title">Sign in to your account</h1>
      <p class="auth-subtitle">Sync study progress across devices and keep your work private.</p>

      <form id="login-form" novalidate autocomplete="on">
        <div class="field">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" autocomplete="email" required placeholder="you@school.edu" aria-describedby="login-email-hint">
          <p id="login-email-hint" class="field-hint" hidden></p>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" autocomplete="current-password" required placeholder="••••••••••" aria-describedby="login-password-hint">
          <p id="login-password-hint" class="field-hint" hidden></p>
        </div>

        <div id="login-error" class="auth-error" role="alert" hidden></div>

        <button id="login-submit" class="btn-primary" type="submit" autofocus>Sign in</button>

        <p class="auth-alt">
          <a href="/register.html">Create an account</a>
          · <a href="/forgot.html">Reset password</a>
        </p>
      </form>
    </main>

    <footer class="auth-footer">
      <p>All study data stays on your FastLectures server. No tracking, no ads.</p>
    </footer>
  </div>

  <script src="auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      if (FASTLECTURES_AUTH.authenticated) { location.replace("/"); return; }
      const form = document.getElementById("login-form"), email = document.getElementById("login-email"), password = document.getElementById("login-password"), error = document.getElementById("login-error"), submit = document.getElementById("login-submit");
      form.addEventListener("submit", async function(e) {
        e.preventDefault(); error.hidden = true; submit.disabled = true; submit.textContent = "Signing in…";
        try {
          await FASTLECTURES_AUTH.login(email.value, password.value);
          location.replace("/");
        } catch (err) {
          error.textContent = err.message || "Sign-in failed."; error.hidden = false; submit.disabled = false; submit.textContent = "Sign in";
        }
      });
    });
  </script>
</body>
</html>
