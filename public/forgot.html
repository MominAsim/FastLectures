<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05050a">
  <link rel="icon" type="image/png" href="fastlectures-mark.png">
  <title>Reset password | FastLectures</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <div class="auth-layout">
    <header class="auth-header">
      <a class="auth-brand" href="/login.html" aria-label="Back to sign in">
        <svg class="auth-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6c-.8-.9-2-1.5-3.4-1.6H6.6C5 3 3.5 3.6 2.4 4.8 1.3 6 1 7.5 1.6 9l2.3 12.8c.2 1.2 1.2 2.1 2.5 2.2h9.2c1.3.1 2.3-1 2.5-2.2L22.4 9c.6-1.5.3-3-.8-4.4zM8 17l-1.5-8.8h2L10 17H8zm4 0h2.1l.6-3.6.8-4.5H13L12.2 17zm6.5 0h-2.2l-1.4-8H19l1.5 8z"/></svg>
        <span class="auth-name">FastLectures</span>
      </a>
    </header>
    <main class="auth-card">
      <h1 class="auth-title">Choose a new password</h1>
      <p class="auth-subtitle">We'll send you a secure reset link. Paste it below, then pick a new password.</p>
      <form id="forgot-form" novalidate>
        <div class="field">
          <label for="forgot-email">Email</label>
          <input id="forgot-email" type="email" autocomplete="email" required placeholder="you@school.edu">
          <p id="forgot-email-hint" class="field-hint" hidden></p>
        </div>
        <div id="forgot-error" class="auth-error" role="alert" hidden></div>
        <div id="forgot-success" class="notice info" hidden>If that email has an account, a reset link has been queued. Check your inbox.</div>
        <button id="forgot-submit" class="btn-primary" type="submit">Send reset link</button>
      </form>
      <p class="auth-alt"><a href="/login.html">Back to sign in</a> · <a href="/register.html">Create account</a></p>
    </main>
    <footer class="auth-footer"><p>This link expires in 1 hour. Ignore if this wasn't you.</p></footer>
  </div>
  <script src="auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const form = document.getElementById("forgot-form"), email = document.getElementById("forgot-email"), error = document.getElementById("forgot-error"), success = document.getElementById("forgot-success"), submit = document.getElementById("forgot-submit");
      form.addEventListener("submit", async function(e) {
        e.preventDefault(); error.hidden = true; success.hidden = true; submit.disabled = true; submit.textContent = "Sending…";
        try {
          await FASTLECTURES_AUTH.forgot(email.value);
          form.reset(); success.hidden = false; submit.disabled = false; submit.textContent = "Send reset link";
        } catch (err) { error.textContent = err.message; error.hidden = false; submit.disabled = false; submit.textContent = "Send reset link"; }
      });
    });
  </script>
</body>
</html>
